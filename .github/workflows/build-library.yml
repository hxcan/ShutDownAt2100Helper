name: Build ShutDownAt2100Helper

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # allow committing baseline.xml back to the PR branch

    steps:
    - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission to gradlew
      run: chmod +x gradlew

    # Step 1: Generate lint baseline if it doesn't exist (history warnings/errors)
    - name: Generate Lint baseline (if missing)
      run: |
        if [ ! -f autoshutdowntest/lint-baseline.xml ]; then
          echo "Baseline file not found, generating..."
          ./gradlew :autoshutdowntest:updateLintBaseline --warning-mode none || true
        else
          echo "Baseline file exists, skipping generation"
        fi

    # Step 2: Run lint with baseline (suppresses historical issues, blocks NEW errors)
    - name: Run Lint with baseline
      run: ./gradlew :autoshutdowntest:lintRelease --warning-mode none

    # Step 3: Build release AAR (library product, no APK signing required)
    - name: Build Release AAR
      run: |
        export GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx2048m -Dorg.gradle.daemon=false"
        ./gradlew :autoshutdowntest:assembleRelease --warning-mode none

    # Step 4: Publish to localMaven (verifies publication configuration)
    - name: Publish to localMaven
      run: ./gradlew :autoshutdowntest:publishReleasePublicationToMavenLocal --warning-mode none

    # Step 5: Auto-commit lint baseline back to branch (if anything changed)
    # 此步在 PR 和 push 模式下都会执行：确保 baseline.xml 一定会出现在仓库里
    - name: Auto-commit lint baseline
      if: github.event_name == 'push' || github.event_name == 'pull_request'
      run: |
        if [ -f autoshutdowntest/lint-baseline.xml ]; then
          git config user.name "sisterfuture-bot"
          git config user.email "etakka@gmail.com"
          git add autoshutdowntest/lint-baseline.xml
          if git diff --cached --quiet; then
            echo "No baseline changes to commit"
          else
            git commit -m "ci(lint): auto-generated baseline from CI first run"
            git push
          fi
        fi

    # Upload artifacts
    - name: Upload lint baseline
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: shutdownat2100helper-lint-baseline
        path: autoshutdowntest/lint-baseline.xml
        if-no-files-found: ignore

    - name: Upload Release AAR artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: shutdownat2100helper-aar-release
        path: autoshutdowntest/build/outputs/aar/*.aar
        if-no-files-found: ignore